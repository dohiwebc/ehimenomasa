name: Build from microCMS

on:
  workflow_dispatch:
  repository_dispatch:
    # microCMS の Webhook「トリガーイベント名」と一致させる
    types: [microcms, microcms_build]
  schedule:
    # 念のため1日1回（Webhook が主）
    - cron: "0 15 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build site from microCMS
        env:
          MICROCMS_SERVICE_ID: ehimenomasa
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: python scripts/build_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "microCMS の内容を静的サイトへ反映する。"
          git push
